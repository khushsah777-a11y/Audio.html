
<html >
<head>

    <title>Iframe </title>
</head>
<body>

    <h1>HTML Iframe Examples</h1>


    <h3>1. Embedding an external webpage</h3>
    <iframe src="https://www.wikipedia.org/" width="600" height="400" title="Example Website">
        <p>Your browser does not support iframes.</p>
    </iframe>

    <br><br>

   
    <h3>2. Embedding a YouTube Video</h3>
    <iframe width="560" height="315" 
            src="https://youtube.com" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

</body>
</html>
